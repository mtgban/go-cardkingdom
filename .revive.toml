# Style rules the tree already satisfies, so that a regression is caught at
# review time rather than found later. Ported from go-mtgban's .revive.toml.

ignoreGeneratedHeader = false
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.exported]
[rule.errorf]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unnecessary-format]
[rule.unchecked-type-assertion]
[rule.use-any]
[rule.use-waitgroup-go]
[rule.use-errors-new]
# A deferred Close on a request body already read and on a file opened only
# for reading reports nothing a caller could act on, and neither does a Write
# to the ResponseWriter of a test handler. Naming them keeps a real unhandled
# error from being lost among the ones that are not.
[rule.unhandled-error]
  arguments = ["io.Closer.Close", "os.File.Close", "net/http.ResponseWriter.Write"]
[rule.unreachable-code]
[rule.var-declaration]
[rule.var-naming]
